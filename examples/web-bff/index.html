<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Provider A 网页接入示例</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/client.js"></script>
</head>
<body>
  <header class="topbar">
    <strong>Provider A <span>网页接入示例</span></strong>
    <div class="top-actions">
      <span id="status" role="status">正在检查连接</span>
      <button id="new-conversation" type="button">新对话</button>
    </div>
  </header>
  <main>
    <div id="conversation" class="conversation" aria-live="polite"></div>
  </main>
  <form id="composer" class="composer">
    <label for="question">提问</label>
    <textarea id="question" rows="1" maxlength="2000" placeholder="输入知识库相关问题" required></textarea>
    <div class="composer-actions">
      <label id="web-option" class="web-option" hidden><input id="web-intent" type="checkbox">本轮请求联网</label>
      <button id="send" type="submit">发送</button>
      <button id="stop" type="button" hidden>停止</button>
    </div>
  </form>
</body>
</html>
