name: Provider A CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install agent client dependencies
        run: npm ci --prefix packages/ima-qa-client --ignore-scripts

      - name: Run tests
        run: npm test
        env:
          PROVIDER_ADMIN_CONTRACT_ROOT: ${{ github.workspace }}

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Verify standalone agent package
        working-directory: packages/ima-qa-client
        run: npm pack --dry-run
      - name: Native touch targets and mobile composer (Chromium)
        run: npm run test:mobile-ui
